app = 'lugo-vieneu-tts'
primary_region = 'sin'

[build]
  dockerfile = '../../../infra/docker/Dockerfile.model_service'

[env]
  SERVICE_KIND = 'tts'
  SERVICE_ENGINE = 'vieneu'
  SERVICE_PORT = '8100'

[http_service]
  internal_port = 8100
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 0

[[http_service.checks]]
  interval = '30s'
  timeout = '5s'
  grace_period = '120s'
  method = 'GET'
  path = '/health'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '1gb'

[[vm]]
  cpu_kind = "shared"
  cpus = 8
  memory = "2gb"
  memory_mb = 2_048
  processes = [ "app" ]
  size = "shared-cpu-8x"