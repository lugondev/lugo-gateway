# Standalone Coolify "Docker Compose" app: vieneu (TTS, CPU/onnxruntime) only.
# One service per file so it deploys as its own Coolify resource, independent
# of the STT app (docker-compose.stt-qwen3-asr-gguf.yml) — see
# docker-compose.vm.yml for the combined two-service form (plain SSH + docker
# compose deploys).
#
# context is "." (repo root), not "../.." -- Coolify invokes `docker compose`
# with --project-directory set to the app's base_directory (repo root here),
# which makes it the resolution base for every relative build.context, no
# matter where this file itself lives in the tree. Building this locally
# needs the same override: `docker compose -f infra/compose/<this file>
# --project-directory . build` from the repo root.

services:
  tts-vieneu:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.model_service
    environment:
      SERVICE_KIND: tts
      SERVICE_ENGINE: vieneu
      SERVICE_PORT: "8100"
      SERVICE_API_TOKEN: ${SERVICE_API_TOKEN:?set SERVICE_API_TOKEN}
    # No host port publish: this app and stt-qwen3-asr-gguf share one physical
    # server, so both containers binding host port 8100 collides ("port is
    # already allocated"). `expose` is enough for Traefik + other Coolify apps
    # on the same internal "coolify" network to reach this container.
    expose:
      - "8100"
    restart: unless-stopped
