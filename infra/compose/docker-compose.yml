version: "3.9"

services:
  api:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.api
    env_file:
      - ../../.env.example
    ports:
      - "8000:8000"
    volumes:
      - ../../:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    working_dir: /app

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
