version: "3.9"

services:
  api:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.api
    env_file:
      - ../../.env.example
    ports:
      - "8000:8000"
    volumes:
      - ../../:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    working_dir: /app

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  model-service-stt:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.model_service
      args:
        BUILD_QWEN3_ASR_GGUF: "1"
    environment:
      SERVICE_KIND: stt
      SERVICE_ENGINE: qwen3_asr_gguf
      SERVICE_PORT: "8100"
      SERVICE_API_TOKEN: ${MODEL_SERVICE_TOKEN:?set MODEL_SERVICE_TOKEN}
    ports:
      - "8100:8100"

  model-service-tts:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.model_service
    environment:
      SERVICE_KIND: tts
      SERVICE_ENGINE: vieneu
      SERVICE_PORT: "8100"
      SERVICE_API_TOKEN: ${MODEL_SERVICE_TOKEN:?set MODEL_SERVICE_TOKEN}
    ports:
      - "8101:8100"
