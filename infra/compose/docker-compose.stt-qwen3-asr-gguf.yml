# Standalone Coolify "Docker Compose" app: qwen3_asr_gguf (STT) only.
# One service per file so it deploys as its own Coolify resource, independent
# of the TTS app (docker-compose.tts-vieneu.yml) — see docker-compose.vm.yml
# for the combined two-service form (plain SSH + docker compose deploys).
#
# context is "." (repo root), not "../.." -- Coolify invokes `docker compose`
# with --project-directory set to the app's base_directory (repo root here),
# which makes it the resolution base for every relative build.context, no
# matter where this file itself lives in the tree. Building this locally
# needs the same override: `docker compose -f infra/compose/<this file>
# --project-directory . build` from the repo root.

services:
  stt-qwen3-asr-gguf:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.model_service
      # Compiles qwen3-asr-cli + converts the GGUF at build time (network
      # access needed: clones qwen3-asr.cpp, pulls the ~1.2GB HF safetensors).
      # Was pinned to 0.6B for a while -- this VM ran out of disk converting
      # 1.7B (source safetensors + gguf output peaks ~6-7GB) even with the
      # build-time cleanup in the Dockerfile. Retrying 1.7B now that a
      # completed build has run since (Coolify's own disk-cleanup may have
      # reclaimed space); if this fails with "no space left on device" again,
      # fall back to the 0.6B args below (kept for reference) until the VM
      # gets more disk or the .gguf is pre-baked elsewhere and mounted.
      #   QWEN3_ASR_GGUF_HF_MODEL: Qwen/Qwen3-ASR-0.6B
      args:
        BUILD_QWEN3_ASR_GGUF: "1"
    environment:
      SERVICE_KIND: stt
      SERVICE_ENGINE: qwen3_asr_gguf
      SERVICE_PORT: "8100"
      SERVICE_API_TOKEN: ${SERVICE_API_TOKEN:?set SERVICE_API_TOKEN}
      STT_QWEN3_ASR_GGUF_N_THREADS: ${STT_QWEN3_ASR_GGUF_N_THREADS:-2}
    # No host port publish: this app and tts-vieneu share one physical server,
    # so both containers binding host port 8100 collides ("port is already
    # allocated"). `expose` is enough for Traefik + other Coolify apps on the
    # same internal "coolify" network to reach this container.
    expose:
      - "8100"
    restart: unless-stopped
