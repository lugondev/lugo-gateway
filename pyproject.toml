[project]
name = "speech-text-transformer"
version = "0.1.0"
description = "STT + TTS streaming platform foundation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic-settings>=2.4.0",
  "python-multipart>=0.0.9",
  "numpy>=1.26.0",
  "httpx>=0.27.0",
  "vosk>=0.3.44",
  "faster-whisper>=1.1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.23.0",
  "ruff>=0.6.0",
]
# Apple-Silicon GPU STT (whisper_mlx ~7x faster; qwen_omni audio-native). Mac only.
# torchvision is needed by the Qwen3-Omni processor (mlx-vlm).
mlx = [
  "mlx-whisper>=0.4.0",
  "mlx-vlm>=0.6.3",
  "torchvision",
]
# Opus audio transport (ESP32/RPi/browser). Needs system libopus
# (apt-get install libopus0 / brew install opus).
opus = [
  "opuslib>=3.0.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["apps/api_gateway"]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["apps/api_gateway/app"]

[tool.ruff]
line-length = 100
