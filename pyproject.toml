[project]
name = "speech-text-transformer"
version = "0.1.0"
description = "STT + TTS streaming platform foundation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115.0",
  "itsdangerous>=2.1.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic-settings>=2.4.0",
  "python-multipart>=0.0.9",
  "numpy>=1.26.0",
  "scipy>=1.13.0",
  # core/audio.py's mp3/ogg/flac decode fallback (via libsndfile). Was already
  # present transitively through vieneu -- declared explicitly now so it can't
  # silently vanish from an image the way scipy did.
  "soundfile>=0.12.1",
  "httpx>=0.27.0",
  "websockets>=14.0",
  "vosk>=0.3.44",
  "sqlalchemy[asyncio]>=2.0.0",
  "aiosqlite>=0.20.0",
  "asyncpg>=0.29.0",
  "psycopg[binary]>=3.2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.23.0",
  "pytest-timeout>=2.3.0",
  "ruff>=0.6.0",
]
# Apple-Silicon GPU STT (whisper_mlx ~7x faster). Mac only.
mlx = [
  "mlx-whisper>=0.4.0",
]
# faster-whisper (CTranslate2) -- the CPU "whisper"/"whisper_local" engine. Was
# an unconditional base dependency, which meant every model_service image
# (qwen3_asr_gguf, vieneu, ...) paid for ctranslate2's native wheel even though
# only the gateway itself serves this engine. Opt-in now, matching every other
# engine; the gateway's own Dockerfile still installs it.
whisper = [
  "faster-whisper>=1.1.0",
]
# Opus audio transport (ESP32/RPi/browser). Needs system libopus
# (apt-get install libopus0 / brew install opus).
opus = [
  "opuslib>=3.0.1",
]
# VieNeu-TTS — Vietnamese TTS. One package, two execution paths inside the same
# default v3turbo mode: `V3TurboVieNeuTTS(device="auto", backend="auto")` runs
# ONNX Runtime (torch-free) when no CUDA device is visible and PyTorch when one
# is, so the GPU variant needs no extra of its own -- just torch present in the
# image (see infra/compose/docker-compose.tts-vieneu-gpu.yml). vieneu's own
# `legacy` extra is for its *older* modes (standard/fast/turbo), not for GPU.
# soundfile needs system libsndfile1 (apt-get install libsndfile1).
tts = [
  "vieneu>=3.2.3",
]
# Qwen3-ASR on Apple Silicon via MLX (multilingual incl. Vietnamese, torch-free,
# Metal GPU). Mac-only — the engine auto-hides where mlx-qwen3-asr is absent.
qwen3-asr = [
  "mlx-qwen3-asr",
]
# Qwen3-ASR on NVIDIA GPU via the official qwen-asr (PyTorch + CUDA). For GPU hosts
# (e.g. a Colab T4). Pulls torch+CUDA — heavy; needs a GPU at runtime.
qwen3-asr-cuda = [
  "qwen-asr",
]
# Qwen3-TTS (0.6B/1.7B) via the official qwen-tts. Runs on CPU/MPS/CUDA (no
# flash-attention off CUDA); the engine auto-hides where qwen-tts is absent.
qwen3-tts = [
  "qwen-tts",
]
# Qwen3-TTS on NVIDIA GPU via faster-qwen3-tts (manual CUDA graph capture,
# real-time inference). CUDA-only — no CPU/MPS fallback exists in that
# package, so this extra is meaningless without a real GPU at runtime. The
# engine auto-selects this backend over qwen-tts whenever both a CUDA device
# and faster_qwen3_tts are present; qwen3-tts (above) is still required as the
# CPU/MPS baseline. See https://github.com/andimarafioti/faster-qwen3-tts.
qwen3-tts-cuda = [
  "faster-qwen3-tts",
]
# OmniVoice (k2-fsa) — multilingual TTS. Only needed where the engine actually
# runs its model: on a dev Mac the provider shells out to a separate OmniVoice
# checkout's own venv (OMNIVOICE_PATH/.venv/bin/python) and this extra is not
# installed, but a single-engine container has no second venv to shell into, so
# it installs omnivoice alongside the app and points OMNIVOICE_PYTHON at its own
# interpreter. Pulls torch (CPU wheels unless the image asks for CUDA ones).
omnivoice = [
  "omnivoice>=0.2.1",
]
# VoxCPM2 (openbmb) — 30-language TTS with voice cloning + voice design, 48 kHz.
# Runs on CPU/MPS and on CUDA (much faster); same package either way, the device
# is picked by torch at runtime. See tts/providers/extra_engines.py.
voxcpm = [
  "voxcpm>=2.0.3",
]
# edge-tts — free cloud TTS via Microsoft Edge's Read Aloud service. No API key,
# no local model, but needs outbound network access; unofficial (reverse-engineered)
# API, test-UI/batch use only (see docs/superpowers/specs/2026-07-11-edge-tts-provider-design.md).
edge-tts = [
  "edge-tts>=7.2.8",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["apps/api_gateway", "apps"]
testpaths = ["tests"]
# Hang protection, two layers (the whole suite runs in ~47s, so nothing
# legitimate gets close to either limit):
# - faulthandler dumps every thread's stack at 100s stuck -- the diagnosis.
# - pytest-timeout hard-kills the run at 120s stuck -- the backstop, so a
#   wedged test (e.g. a WS TestClient portal teardown deadlock) costs 2
#   minutes and a stack trace, never an indefinite silent hang.
faulthandler_timeout = 100
timeout = 120
timeout_method = "thread"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["apps/api_gateway/app"]

[tool.ruff]
line-length = 100
